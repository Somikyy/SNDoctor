name: release

# Cut a release by pushing a tag:  git tag v26.8.2 && git push origin v26.8.2
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 21 compiles, 17 is emitted - paper-api 1.21.4 is published for Java 21 and Gradle will
      # not resolve it onto a Java 17 classpath. Both builds must use this same JDK, otherwise
      # the stub comparison below drowns in javac version noise.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Behaviour is proven offline: 39 assertions on synthetic fixture jars.
      - name: Self-test (offline)
        run: bash tools/offline/verify.sh

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # The published jar is built against the REAL paper-api, never against the offline
      # stubs. A stub with the wrong return type compiles fine and then throws
      # NoSuchMethodError on a live server, and no admin should ever be the one to find that
      # out. Unlike in the build workflow, nothing here is allowed to fail: a release that
      # cannot be built against the real API is not a release.
      - name: Build against the real paper-api
        run: gradle build --no-daemon

      - name: Stubs must match the real Bukkit API
        run: |
          bash tools/offline/api-surface.sh build/offline/classes --all > /tmp/from-stubs.txt
          bash tools/offline/api-surface.sh build/classes/java/main --all > /tmp/from-paper.txt
          if ! diff -u /tmp/from-stubs.txt /tmp/from-paper.txt; then
            echo "::error::tools/offline/bukkit-stubs disagrees with the real paper-api"
            exit 1
          fi
          echo "stubs agree with paper-api"

      # A tag that disagrees with the version compiled into the jar would advertise a release
      # that does not exist inside the file. Cheaper to catch here than in a bug report.
      - name: Tag must match the compiled version
        run: |
          VERSION="$(grep -oP 'VERSION = "\K[^"]+' src/main/java/network/somikyy/sndoctor/core/ScanService.java)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ScanService.VERSION=$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release may already exist as a draft prepared by hand; that is fine.
          gh release create "$GITHUB_REF_NAME" \
             --title "SNDoctor $VERSION" \
             --notes "Проверка плагинов на совместимость с Minecraft 26.x. Установка и описание — в README репозитория." \
             || echo "release already exists, uploading into it"
          gh release upload "$GITHUB_REF_NAME" \
             "build/libs/SNDoctor-$VERSION.jar" --clobber
