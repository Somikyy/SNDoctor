#
#   Плагин бесплатный и с открытым исходным кодом. Если он тебе пригодился —
#   загляни в Telegram: там выходят новые плагины линейки SN, а ещё там можно
#   заказать плагин или 3D-модель под свой проект.
#
#                              ▸  t.me/somikyy  ◂
#
# ─────────────────────────────────────────────────────────────────────────────
#  ЧТО ЭТО ДЕЛАЕТ
# ─────────────────────────────────────────────────────────────────────────────
#  С версии 26.1 Mojang больше не отдаёт обфусцированные server-jar'ы, а Paper
#  выкинул внутренний ремаппер. Плагин со Spigot-маппингами не запустится — и
#  узнать об этом заранее раньше было нечем.
#
#  SNDoctor читает каждый jar в папке plugins как zip-архив, а каждый class —
#  как поток байт, и говорит, что сломается. Проверяемый плагин никогда не
#  попадает в JVM: SNDoctor не загружает и не выполняет чужой код.
#
#  Главный сценарий — до обновления, из командной строки, без запуска сервера:
#      java -jar SNDoctor.jar plugins --java 25
# ─────────────────────────────────────────────────────────────────────────────

# Не трогать. Используется для миграции конфигов между версиями.
config-version: 1

general:

  # Язык отчёта: ru или en. Флаг команды (--lang en) перекрывает эту настройку
  # для одного запуска, файл отчёта пишется на выбранном здесь языке.
  language: ru

  # Проверять при старте, не вышла ли новая версия SNDoctor.
  # Это один HTTPS-запрос к api.github.com в отдельном потоке. Любая ошибка
  # гасится молча: проверка версии не имеет права ни падать, ни спамить.
  # false — плагин не ходит в сеть вообще никогда.
  update-check: true


# ─────────────────────────────────────────────────────────────────────────────
#  АВТОМАТИЧЕСКАЯ ПРОВЕРКА
# ─────────────────────────────────────────────────────────────────────────────
scan:

  # Проверять плагины сразу после запуска сервера и писать итог в консоль.
  # Ради этого плагин и ставят: обновил ядро, поднял сервер — и сразу видишь,
  # что именно не завелось, вместо чтения стектрейсов по одному.
  #
  # Чтение десятков jar-ов идёт в отдельном потоке, главный поток не трогается.
  on-start: true

  # Задержка перед автопроверкой, в тиках. Нужна, чтобы не мешать остальным
  # плагинам грузиться и не портить их вывод в консоли. 100 тиков = 5 секунд.
  start-delay: 100

  # Показывать ли справочные находки (severity INFO) и перечислять зелёные
  # плагины. Аналог флага --full. На сервере с полусотней плагинов включённый
  # full — это очень длинный отчёт, поэтому по умолчанию выключено.
  full: false


# ─────────────────────────────────────────────────────────────────────────────
#  ОТЧЁТЫ НА ДИСКЕ
#  Пишутся в plugins/SNDoctor/reports/ после каждой проверки.
# ─────────────────────────────────────────────────────────────────────────────
reports:

  # false — отчёты не пишутся вообще, итог виден только в чате и консоли.
  enabled: true

  # Дополнительно писать машиночитаемый .json рядом с текстовым отчётом —
  # для бота, панели или CI. Формат описан в docs/SPEC-SNDoctor.md.
  json: true

  # Сколько последних проверок хранить. Старые файлы удаляются автоматически.
  # Каждая проверка — это два файла, поэтому без потолка папка растёт вечно.
  # 0 = не удалять ничего.
  keep: 20
