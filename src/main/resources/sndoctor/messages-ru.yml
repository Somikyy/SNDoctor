# ┌──────────────────────────────────────────────────────────────────────────────┐
# │  SNDoctor — все тексты плагина. Правьте свободно, плагин ничего не           │
# │  перезаписывает: этот файл ваш с момента первого запуска.                    │
# │                                                                              │
# │  После правки — /sndoctor reload. Ключ, который вы удалили или испортили,    │
# │  берётся из встроенного набора: сломать плагин этим файлом нельзя.           │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# ЦВЕТА. Пишите как привыкли — понимаются все четыре записи сразу:
#   &c  &l  &r              — обычные коды (§ тоже работает);
#   &#7B2FFF                — HEX, короткая запись;
#   &x&7&B&2&F&F&F          — HEX, длинная запись из конфигов эпохи Spigot;
#   <red> <#7B2FFF> <bold>  — теги MiniMessage, как в остальных плагинах линейки.
# В чат всё это уходит обычными кодами §: SNDoctor не использует Adventure, чтобы
# работать и на Spigot, и на старых сборках Paper — там, где сервер уже сломан и
# отчёт нужен больше всего. Плата честная: <gradient>, <click> и <hover> в чате не
# рисуются — текст остаётся, эффект пропадает.
#
# Скобка как текст — через экран: '\<red>' покажет буквы <red>, а не цвет; сам
# обратный слэш удваивается: '\\'. Чат и лог показывают при этом одно и то же.
#
# ГДЕ ЦВЕТА ВИДНЫ. Только в игровом чате — ключи chat.*. Текст отчёта (rule.* и
# ui.*) уходит в файл, в консоль и в CLI, где разметки нет: цвета оттуда просто
# вырезаются, а свою раскраску отчёт рисует сам.
#
# ЗНАЧЕНИЯ — в одинарных кавычках. Апостроф внутри удваивается: 'server-jar''ы'.
# ПОДСТАНОВКИ вида {plugin}, {java}, {version} заменяются плагином — не трогайте их.

# На каком языке написан этот файл. Плагин сверяет штамп с general.language в config.yml
# и предупреждает в консоли, если они разошлись: как только файл создан, тексты берутся
# из него, и переключение языка в конфиге уже ничего не меняет.
language: ru

# Приписка в начале строк в чате. Чтобы убрать название плагина отовсюду разом —
# сделайте её пустой:  prefix: ''
prefix: '&bSNDoctor &8» '

# ---------- игровой чат
chat:
  no-permission: '{prefix}&cНет прав.'
  reload-done: '{prefix}&aconfig.yml и messages.yml перечитаны.'
  scanning: '{prefix}&7Проверяю плагины…'
  already-scanning: '{prefix}&eПроверка уже идёт, подожди.'
  report-file: '{prefix}&7Полный отчёт: &f{path}'
  scan-failed: '{prefix}&cОшибка проверки: {reason}'

  version:
    line: '{prefix}&f{version} &7— цель: {target}'
    source: '&7Открытый код: &fgithub.com/Somikyy/SNDoctor'

  help:
    header: '{prefix}&7{version}'
    scan: '&f/sndoctor scan &7— краткий отчёт в чат, полный в файл'
    full: '&f/sndoctor full &7— показать и справочные находки'
    lang: '&f/sndoctor scan --lang en &7— отчёт на английском'
    reload: '&f/sndoctor reload &7— перечитать config.yml и messages.yml'

  # Сводка в чат после проверки. Первая строка — с приставкой, остальные без неё:
  # название плагина в каждой строке сводки читается как спам.
  summary:
    header: '{prefix}&7{version} &8· &7цель {target}'
    red: '&cКрасных &f{count}'
    yellow: '&eЖёлтых &f{count}'
    green: '&aЗелёных &f{count}'
    review: '&dНа проверку &f{count}'
    red-header: '&cНе запустятся:'
    red-line: ' &7• &f{plugin}{reason}'
    red-reason: ' &8— &7{title}'
    red-more: ' &8…и ещё {count} — смотри файл отчёта'
    all-clear: '&aКритичных проблем не найдено.'

# ---------- строка в консоль, когда вышла новая версия
update:
  available: 'Доступна новая версия SNDoctor: {latest} (у тебя {current}) — https://github.com/Somikyy/SNDoctor/releases'

# ---------- находки: заголовок, почему ломается, что делать
# Ключ собирается из id правила — того самого, что видно в JSON-отчёте и в
# таблице раздела 4 файла docs/SPEC-SNDoctor.md.
rule:

  # BLOCKER
  nms.spigot-mappings:
    title: 'Spigot-маппинги NMS'
    why: 'С 26.1 Mojang не отдаёт обфусцированные server-jar''ы, а Paper полностью убрал внутренний ремаппер. Формулировка PaperMC: плагин со Spigot-маппингами «не будет работать на 26.1, независимо от того, Paper у вас или нет».'
    fix: 'Пересобрать плагин на Mojang-маппингах (paperweight-userdev) или найти замену. Обновление плагина автором — самый быстрый путь.'

  # BLOCKER
  nms.legacy-versioned-package:
    title: 'Версионный пакет NMS (до 1.17)'
    why: 'Пакеты net.minecraft.server.v1_XX_RX исчезли ещё в 1.17. На 1.17+ такой плагин не загрузится вообще.'
    fix: 'Плагин рассчитан на 1.16 и старше. Нужна принципиально новая версия или замена.'

  # BLOCKER
  craftbukkit.versioned:
    title: 'Версионный пакет CraftBukkit'
    why: 'Paper убрал релокацию org.bukkit.craftbukkit.vX_Y_RZ ещё в 1.20.5. Такие ссылки приводят к NoClassDefFoundError при загрузке.'
    fix: 'Заменить на неверсионные org.bukkit.craftbukkit.* или на публичный API.'

  # WARN
  nms.version-reflection:
    title: 'Определение версии через vX_Y_RZ в строках'
    why: 'Плагин собирает имя класса из версии пакета. На 1.20.5+ релокации больше нет, и такой код обычно падает или молча уходит в ветку «неподдерживаемая версия».'
    fix: 'Убрать версионную рефлексию. Работать с неверсионным CraftBukkit или с API.'

  # INFO
  craftbukkit.direct:
    title: 'Прямое обращение к CraftBukkit'
    why: 'Плагин использует внутренности сервера напрямую. Само по себе это не поломка, но такие места чаще всего ломаются при смене мажорной версии.'
    fix: 'Ничего делать не нужно — просто проверь этот плагин первым после обновления.'

  # WARN
  api.conversation:
    title: 'Conversation API (deprecated for removal)'
    why: 'Paper 1.21.9/1.21.10: «This API has been unmaintained and largely unused for a long time... Hence, we have decided to deprecate it for removal.» Пакет org.bukkit.conversations будет удалён.'
    fix: 'Перейти на Dialog API или слушать AsyncChatEvent вручную.'

  # WARN
  api.metadata:
    title: 'Metadata API (deprecated)'
    why: 'Paper 1.21.9/1.21.10: «The entity/block entity Metadatable API has been deprecated as it is generally inferior to the PersistentDataContainer API.» Исторически этот API — источник утечек памяти.'
    fix: 'Перейти на PersistentDataContainer.'

  # WARN
  api.player-spawn-location-event:
    title: 'PlayerSpawnLocationEvent (deprecated)'
    why: 'Paper 1.21.9/1.21.10: «Plugins should migrate to the AsyncPlayerSpawnLocationEvent as soon as possible, as listening to the PlayerSpawnLocationEvent has unintended side effects.» Загрузка спавна переехала в configuration-фазу.'
    fix: 'Перейти на AsyncPlayerSpawnLocationEvent.'

  # BREAKING
  api.teleport-flag-entitystate:
    title: 'TeleportFlag.EntityState больше не работает'
    why: 'Paper 1.21.9/1.21.10: «using TeleportFlag.EntityState no longer has any functionality». Флаг принимается, но ничего не делает — это тихая поломка, которую не видно в логах.'
    fix: 'Закрывать инвентарь и высаживать пассажиров вручную перед телепортом.'

  # INFO
  api.gamemode-change-cause:
    title: 'Новая причина GAMEMODE_SWITCHER'
    why: 'Paper 1.21.9 добавил причину GAMEMODE_SWITCHER в PlayerGameModeChangeEvent, заменив ей COMMAND при смене режима через переключатель. Код, который проверяет только COMMAND, теперь пропускает часть случаев.'
    fix: 'Проверить, обрабатывается ли новая причина, если плагин смотрит на Cause.'

  # WARN
  api.legacy-material:
    title: 'Легаси-API предметов (до 1.13)'
    why: 'org.bukkit.material, Material.getId() и durability как подтип — наследие «до флаттенинга» 1.13. Работает нестабильно и давно депрекейтнуто.'
    fix: 'Перейти на Material по имени, BlockData и Damageable.'

  # INFO
  meta.not-a-plugin:
    title: 'Это не плагин'
    why: 'В jar нет plugin.yml и paper-plugin.yml. Обычно это библиотека, положенная в plugins/ по ошибке, или файл, который туда попал случайно.'
    fix: 'Убрать из plugins/, если это не зависимость, которую сервер грузит явно.'

  # BLOCKER
  meta.main-class-missing:
    title: 'Главный класс не найден в jar'
    why: 'В описании указан main, которого нет внутри архива. Сервер упадёт с ClassNotFoundException при загрузке.'
    fix: 'Файл повреждён или собран неправильно. Скачать заново из официального источника.'

  # INFO
  meta.paper-plugin:
    title: 'Paper-плагин (новый загрузчик)'
    why: 'Использует paper-plugin.yml и новый загрузчик Paper. Часть инструментов (например hot-reload) с такими плагинами работает иначе.'
    fix: 'Ничего делать не нужно.'

  # WARN
  meta.no-api-version:
    title: 'Не указан api-version'
    why: 'Без api-version сервер считает плагин legacy-плагином эпохи 1.12 и включает конвертацию материалов. На современных версиях это регулярно заканчивается отказом загрузки.'
    fix: 'Автору — добавить api-version в plugin.yml. Админу — проверить загрузку в логе.'

  # WARN
  meta.ancient-api-version:
    title: 'Очень старый api-version'
    why: 'api-version {api} — до флаттенинга 1.13. Плагин почти наверняка написан под другой набор материалов.'
    fix: 'Ищи обновление или замену.'

  # BLOCKER
  java.too-new:
    title: 'Требует Java {java}, а сервер на Java {server}'
    why: 'Плагин скомпилирован под более новую Java. Загрузка упадёт с UnsupportedClassVersionError.'
    fix: 'Обновить Java на сервере до {java} или взять сборку плагина под старую Java.'

  # INFO
  java.required:
    title: 'Требует Java {java}'
    why: 'Минимальная версия Java, на которой этот плагин запустится.'
    fix: 'Учитывай при выборе версии сервера: Minecraft 26.2 требует Java 25.'

  # INFO
  folia.supported:
    title: 'Заявлена поддержка Folia'
    why: 'В описании стоит folia-supported: true.'
    fix: 'Ничего делать не нужно.'

  # INFO
  meta.runtime-libraries:
    title: 'Скачивает зависимости при старте'
    why: 'Плагин использует секцию libraries: сервер тянет эти артефакты из интернета при запуске. Без сети или при недоступности репозитория плагин не загрузится.'
    fix: 'Учитывай на серверах без внешнего доступа.'

  # WARN
  scan.unreadable-classes:
    title: 'Часть классов не читается'
    why: '{bad} из {total} классов не удалось разобрать. Обычно это обфускация или более новый формат class-файла — отчёт по этому плагину неполный.'
    fix: 'Проверить плагин вручную. Тяжёлая обфускация в бесплатном плагине — повод насторожиться.'

  # WARN
  dep.protocollib:
    title: 'Зависит от ProtocolLib'
    why: 'ProtocolLib — самая хрупкая общая зависимость экосистемы: последний релиз 5.4.0 от 9 августа 2025, в трекере открыт вопрос о том, что OpenJDK планирует закрыть модификацию final-полей через рефлексию. Если ProtocolLib отвалится на новой версии, отвалятся все зависящие от него плагины.'
    fix: 'Проверить совместимость ProtocolLib с целевой версией до апгрейда. Многие плагины уже переехали на PacketEvents.'

  # INFO
  dep.vault:
    title: 'Зависит от Vault'
    why: 'Vault не обновлялся с 2020 года, запрос на поддержку Folia в его трекере висит с марта 2024. Существует активный форк VaultUnlocked.'
    fix: 'Если планируешь Folia — посмотри в сторону VaultUnlocked.'

  # SECURITY
  sec.process-execution:
    title: 'Запускает внешние процессы'
    why: 'Плагин вызывает Runtime.exec или ProcessBuilder. Для бэкап- и рестарт-плагинов это нормально, для всего остального — повод посмотреть, что именно запускается.'
    fix: 'Сверить с назначением плагина. Если это чат-плагин — вопросов больше, чем ответов.'

  # SECURITY
  sec.dynamic-class-loading:
    title: 'Загружает код во время работы'
    why: 'Найдены URLClassLoader или defineClass. Так работают легитимные загрузчики библиотек — и так же работает подгрузка полезной нагрузки извне.'
    fix: 'Посмотреть, откуда берётся загружаемый код: из локального файла или из сети.'

  # SECURITY
  sec.suspicious-endpoints:
    title: 'Обращения к нетипичным адресам'
    why: 'В строках найдены адреса, по которым обычно не ходят плагины: сырые IP, пейстбины, вебхуки, туннели.'
    fix: 'Проверить вручную. Легитимные плагины ходят на свои домены и на известные API.'

  # SECURITY
  sec.server-files:
    title: 'Читает служебные файлы сервера'
    why: 'Плагин упоминает файлы, где лежат пароль RCON, список операторов и баны. Для админ-плагинов это нормально; в сочетании с сетевой активностью — нет.'
    fix: 'Смотреть вместе с находками по сети: чтение + отправка наружу — плохой признак.'

  # SECURITY
  sec.masquerading-package:
    title: 'Одиночные классы в чужом пакете'
    why: 'В пакете известной библиотеки лежит всего несколько классов. При нормальном шейдинге их сотни. Так маскируют посторонний код: именно в таком виде в мае 2026 нашли бэкдор, притворявшийся org.apache.commons.lang3.'
    fix: 'Открыть эти классы декомпилятором до того, как ставить плагин на живой сервер.'


# ---------- подписи отчёта
# Отступы и пробелы расставляет рендерер — здесь только слова.
ui:
  header: 'проверка плагинов на совместимость с Minecraft'
  directory: 'Папка:'
  jars-found: 'Найдено jar:'
  server-java: 'Java сервера:'
  took: 'Время:'
  count:
    red: 'КРАСНЫЙ'
    yellow: 'ЖЁЛТЫЙ'
    green: 'ЗЕЛЁНЫЙ'
    skipped: 'ПРОПУЩЕН'
    review: 'НА ПРОВЕРКУ'
  section:
    red: 'КРАСНЫЕ — не запустятся'
    yellow: 'ЖЁЛТЫЕ — загрузятся, но есть проблемы'
    skipped: 'ПРОПУЩЕНЫ'
    green: 'ЗЕЛЁНЫЕ — проблем не найдено'
    security: 'НА РУЧНУЮ ПРОВЕРКУ — это не приговор, это повод посмотреть'
  error: 'ошибка:'
  footer: 'Правила SNDoctor опираются на первоисточники (анонсы PaperMC, javadoc, содержимое jar). Спорные и неподтверждённые изменения в набор не включены.'
